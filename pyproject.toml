[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpx-lua"
version = "0.1.0"
description = "🌙 Enterprise Lua & Luau Static Analyzer: Metatable OOP, Coroutines, LuaJIT FFI, GameDev Architectures (Roblox/Neovim/Love2D), GoF 23 & Global Leak Hazards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bivex Team", email = "dev@bivex.io" }
]
keywords = ["lua", "luau", "luajit", "roblox", "neovim", "gamedev", "metatables", "coroutines", "static-analysis", "gof", "sarif"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
dpx-lua = "pattern_detector.adapters.inbound.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src/pattern_detector --cov-report=term-missing"
